<div class="loading-overlay" *ngIf="isLoading">
  <div class="spinner"></div>
  <div class="loading-text">Logging you in, please wait...</div>
  <small class="loading-subtext">(First login may be slightly slower on free hosting.)</small>
</div>

<div class="auth-container">
  <div class="auth-card">
    <h2 class="page-title">Login</h2>

    <form (ngSubmit)="loginUser()" #loginForm="ngForm">
      <!-- Gmail / ID -->
      <label for="gmail">Gmail ID</label>
      <input
        type="email"
        id="gmail"
        name="gmail"
        [(ngModel)]="email"
        required
        placeholder="Enter your Gmail"
        autocomplete="email"
      />

      <!-- Password -->
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        placeholder="Enter your password"
        autocomplete="current-password"
      />

      <!-- Inline error -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="auth-btn"
      >
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

      <p class="redirect-text">
        Don't have an account?
        <a routerLink="/register">Register here</a>
      </p>
    </form>
  </div>
</div>
